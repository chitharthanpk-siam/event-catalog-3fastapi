# ITS RMS EventCatalog POC - local development stack.
# Everything here is throwaway sample infrastructure. No real data, no secrets.

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: its-rms-rabbitmq
    hostname: its-rms-rabbitmq
    ports:
      - "5672:5672"     # AMQP - used by the three services
      - "15672:15672"   # Management UI - http://localhost:15672 (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  identity-service:
    build: ./identity-service
    container_name: its-rms-identity-service
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: its.rms.events
      PORT: "8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  camp-service:
    build: ./camp-service
    container_name: its-rms-camp-service
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: its.rms.events
      PORT: "8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  clinical-service:
    build: ./clinical-service
    container_name: its-rms-clinical-service
    ports:
      - "8003:8003"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: its.rms.events
      PORT: "8003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
